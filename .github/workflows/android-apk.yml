name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-export:
    name: Validate and Export Android APK
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: "4.3"
      GODOT_RELEASE: "4.3-stable"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android Build Tools and Command-line Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "cmdline-tools;latest" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot Headless & Export Templates
        run: |
          mkdir -p ~/.local/bin ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v${GODOT_RELEASE}_linux.x86_64 ~/.local/bin/godot
          chmod +x ~/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f godot.zip templates.tpz

          # Install Android build template if present in export templates
          if [ -f ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip ]; then
            mkdir -p android/build
            unzip -q -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
            echo "${GODOT_VERSION}.stable" > android/.build_version
          fi

      - name: Setup Android Keystore and Editor Settings
        run: |
          mkdir -p ~/.android ~/.config/godot ~/.local/share/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          for d in ~/.config/godot ~/.local/share/godot; do
            for f in "$d/editor_settings-4.tres" "$d/editor_settings-4.3.tres"; do
              echo '[gd_resource type="EditorSettings" format=3]' > "$f"
              echo '' >> "$f"
              echo '[resource]' >> "$f"
              echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> "$f"
              echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" >> "$f"
              echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$f"
              echo 'export/android/debug_keystore_pass = "android"' >> "$f"
              if [ -n "$JAVA_HOME" ]; then
                echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$f"
              fi
            done
          done

      - name: Import Assets Headlessly
        run: |
          godot --headless --editor --quit

      - name: Reapply Editor Settings
        run: |
          for d in ~/.config/godot ~/.local/share/godot; do
            for f in "$d/editor_settings-4.tres" "$d/editor_settings-4.3.tres"; do
              echo '[gd_resource type="EditorSettings" format=3]' > "$f"
              echo '' >> "$f"
              echo '[resource]' >> "$f"
              echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> "$f"
              echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" >> "$f"
              echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$f"
              echo 'export/android/debug_keystore_pass = "android"' >> "$f"
              if [ -n "$JAVA_HOME" ]; then
                echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$f"
              fi
            done
          done

      - name: Run Headless Automated Test Suite
        run: |
          godot --headless "res://scenes/tests/test_runner.tscn"

      - name: Export Android Debug APK
        run: |
          mkdir -p build
          # Export debug APK using Android preset
          godot --verbose --headless --export-debug "Android" build/coin-hell-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coin-hell-debug-apk
          path: build/coin-hell-debug.apk
          if-no-files-found: error
