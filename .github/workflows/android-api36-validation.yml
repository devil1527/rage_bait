name: Validate Android API 36 Export (Godot 4.7.2)

on:
  workflow_dispatch:
  push:
    branches: [ migration/android-api36-godot47 ]

jobs:
  validate-api36:
    name: Validate Android API 36 & 16KB Page Alignment
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: "4.7.2"
      GODOT_RELEASE: "4.7.2-stable"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android Build Tools 36 and Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "cmdline-tools;latest" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> $GITHUB_PATH

      - name: Download Godot 4.7.2 Headless & Export Templates
        run: |
          mkdir -p ~/.local/bin ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v${GODOT_RELEASE}_linux.x86_64 ~/.local/bin/godot
          chmod +x ~/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f godot.zip templates.tpz

      - name: Install Android Build Template for Gradle Build
        run: |
          if [ -f ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip ]; then
            mkdir -p android/build
            unzip -q -o ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
            echo "${GODOT_VERSION}.stable" > android/.build_version
            echo "Installed Android build template from android_source.zip"
          else
            echo "Installing build template via Godot CLI..."
            godot --headless --install-android-build-template
          fi
          if [ -f android/build/gradlew ]; then
            chmod +x android/build/gradlew
          fi

      - name: Setup Android Keystore and Editor Settings
        run: |
          mkdir -p ~/.config/godot ~/.local/share/godot ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          for d in ~/.config/godot ~/.local/share/godot; do
            for f in "$d/editor_settings-4.tres" "$d/editor_settings-4.7.tres"; do
              echo '[gd_resource type="EditorSettings" format=3]' > "$f"
              echo '' >> "$f"
              echo '[resource]' >> "$f"
              echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> "$f"
              echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" >> "$f"
              echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$f"
              echo 'export/android/debug_keystore_pass = "android"' >> "$f"
              echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$f"
            done
          done

      - name: Import Assets Headlessly
        run: |
          godot --headless --editor --quit

      - name: Run Headless Automated Test Suite
        run: |
          godot --headless "res://scenes/tests/test_runner.tscn"

      - name: Export Android Test APK
        run: |
          mkdir -p build
          echo "Starting Godot export-debug for preset 'Android'..."
          set +e
          godot --verbose --headless --export-debug "Android" build/coin-hell-api36-test.apk 2>&1 | tee /tmp/godot_export.log
          EXPORT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ $EXPORT_STATUS -ne 0 ]; then
            echo "::error::Godot export-debug failed with status $EXPORT_STATUS"
            echo "=== LAST 200 LINES OF GODOT EXPORT LOG ==="
            tail -n 200 /tmp/godot_export.log
            exit $EXPORT_STATUS
          fi

      - name: Dump Gradle and Export Logs on Failure
        if: failure()
        run: |
          echo "=== CHECKING ANDROID BUILD DIRECTORY ==="
          ls -la android/build || true
          if [ -f /tmp/godot_export.log ]; then
            echo "=== FULL EXPORT LOG ==="
            cat /tmp/godot_export.log
          fi

      - name: Verify Android Manifest Metadata & Intended ABIs
        run: |
          set -euo pipefail
          echo "=== VERIFYING ANDROID MANIFEST METADATA (API 36 & ABIs) ==="
          APK="build/coin-hell-api36-test.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file $APK does not exist!"
            exit 1
          fi

          AAPT2_BIN="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          echo "Using aapt2 binary: $AAPT2_BIN"
          "$AAPT2_BIN" dump badging "$APK" > /tmp/badging.txt
          echo "=== AAPT2 DUMP BADGING OUTPUT ==="
          cat /tmp/badging.txt
          echo "=================================="

          python3 - << 'EOF'
          import sys, re, os

          with open("/tmp/badging.txt", "r") as f:
              output = f.read()

          errors = []

          EXPECTED = {
              "package": "com.antigravity.retroragearcade",
              "versionCode": "11",
              "versionName": "0.11.0",
              "targetSdkVersion": "36",
              "minSdkVersion": "24",
          }
          EXPECTED_ABIS = {"arm64-v8a", "armeabi-v7a"}

          # Parse package, versionCode, versionName
          pkg_match = re.search(r"\bpackage:.*?\bname='([^']+)'", output)
          ver_code_match = re.search(r"\bversionCode='([^']+)'", output)
          ver_name_match = re.search(r"\bversionName='([^']+)'", output)

          if not pkg_match:
              errors.append("Package name not found in aapt2 output")
          else:
              pkg_name = pkg_match.group(1)
              print(f"Package ID:     {pkg_name}")
              if pkg_name != EXPECTED["package"]:
                  errors.append(f"Package name mismatch: got '{pkg_name}', expected '{EXPECTED['package']}'")

          if not ver_code_match:
              errors.append("versionCode not found in aapt2 output")
          else:
              ver_code = ver_code_match.group(1)
              print(f"Version Code:   {ver_code}")
              if ver_code != EXPECTED["versionCode"]:
                  errors.append(f"versionCode mismatch: got '{ver_code}', expected '{EXPECTED['versionCode']}'")

          if not ver_name_match:
              errors.append("versionName not found in aapt2 output")
          else:
              ver_name = ver_name_match.group(1)
              print(f"Version Name:   {ver_name}")
              if ver_name != EXPECTED["versionName"]:
                  errors.append(f"versionName mismatch: got '{ver_name}', expected '{EXPECTED['versionName']}'")

          # Parse targetSdkVersion
          target_match = re.search(r"\btargetSdkVersion:'(\d+)'", output)
          if not target_match:
              errors.append("targetSdkVersion not found in aapt2 output")
          else:
              target_sdk = target_match.group(1)
              print(f"Target SDK:     {target_sdk}")
              if target_sdk != EXPECTED["targetSdkVersion"]:
                  errors.append(f"targetSdkVersion mismatch: got '{target_sdk}', expected '{EXPECTED['targetSdkVersion']}'")

          # Parse minSdkVersion (sdkVersion)
          min_match = re.search(r"\b(?:minSdkVersion|sdkVersion):'(\d+)'", output)
          if not min_match:
              errors.append("minSdkVersion (sdkVersion) not found in aapt2 output")
          else:
              min_sdk = min_match.group(1)
              print(f"Minimum SDK:    {min_sdk}")
              if min_sdk != EXPECTED["minSdkVersion"]:
                  errors.append(f"minSdkVersion mismatch: got '{min_sdk}', expected '{EXPECTED['minSdkVersion']}'")

          # Parse packaged native ABIs
          abi_match = re.search(r"\bnative-code:\s+(.+)", output)
          if not abi_match:
              errors.append("native-code (ABIs) not found in aapt2 output")
          else:
              abis = set(re.findall(r"'([^']+)'", abi_match.group(1)))
              print(f"Packaged ABIs:  {sorted(list(abis))}")
              missing_abis = EXPECTED_ABIS - abis
              if missing_abis:
                  errors.append(f"Missing expected ABIs: {missing_abis}")

          if errors:
              print("\nMANIFEST VERIFICATION FAILED:")
              for err in errors:
                  print(f"  - {err}")
              sys.exit(1)

          print("\nVERIFIED: Manifest targets API 36 with all required metadata and ABIs.")
          EOF

      - name: Verify Native Library 16 KB ELF Alignment (readelf)
        run: |
          set -euo pipefail
          echo "=== EXTRACTING AND INSPECTING ELF LOAD SEGMENT ALIGNMENT ==="
          APK="build/coin-hell-api36-test.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file $APK does not exist!"
            exit 1
          fi

          python3 - << 'EOF'
          import subprocess, sys, os, hashlib, zipfile

          apk_path = "build/coin-hell-api36-test.apk"
          if not os.path.exists(apk_path):
              print(f"ERROR: APK not found: {apk_path}")
              sys.exit(1)

          # 1. Print APK filename and SHA-256
          with open(apk_path, "rb") as f:
              sha256 = hashlib.sha256(f.read()).hexdigest()
          print(f"APK Filename:   {apk_path}")
          print(f"APK SHA-256:    {sha256}")
          print(f"APK Size:       {os.path.getsize(apk_path)} bytes\n")

          # 2. Extract APK
          unpack_dir = "/tmp/apk_unpacked"
          os.makedirs(unpack_dir, exist_ok=True)
          with zipfile.ZipFile(apk_path, "r") as z:
              z.extractall(unpack_dir)

          # 3. Enumerate all .so files across all ABIs
          so_files = []
          for root, _, files in os.walk(os.path.join(unpack_dir, "lib")):
              for file in files:
                  if file.endswith(".so"):
                      full_path = os.path.join(root, file)
                      rel_path = os.path.relpath(full_path, unpack_dir).replace("\\", "/")
                      parts = rel_path.split("/")
                      abi = parts[1] if len(parts) >= 2 else "unknown"
                      so_files.append((rel_path, full_path, abi))

          so_files.sort(key=lambda x: x[0])
          print(f"Found {len(so_files)} packaged native libraries across ABIs:")
          for rel_path, _, abi in so_files:
              print(f"  - [{abi}] {rel_path}")

          if not so_files:
              print("ERROR: No native libraries found in APK! Empty library list is not permitted.")
              sys.exit(1)

          abis_found = set(abi for _, _, abi in so_files)
          EXPECTED_ABIS = {"arm64-v8a", "armeabi-v7a"}
          missing_abis = EXPECTED_ABIS - abis_found
          if missing_abis:
              print(f"ERROR: Missing expected ABI libraries: {missing_abis}")
              sys.exit(1)

          # 4. Check readelf availability
          try:
              tool_ver = subprocess.run(["readelf", "-v"], capture_output=True, text=True, check=True)
              tool_line = tool_ver.stdout.splitlines()[0] if tool_ver.stdout else "readelf"
              print(f"\nUsing ELF inspection tool: {tool_line}\n")
          except Exception as e:
              print(f"ERROR: readelf is not available: {e}")
              sys.exit(1)

          # 5. Inspect every PT_LOAD segment of every .so
          PAGE_SIZE_16KB = 16384  # 0x4000
          PAGE_SIZE_4KB  = 4096   # 0x1000

          overall_failure = False
          library_results = []

          print("=" * 105)
          print(f"{'Library Path':<42} {'ABI':<12} {'Seg':<4} {'Offset':<12} {'VirtAddr':<14} {'Align':<10} {'Result'}")
          print("=" * 105)

          for rel_path, full_path, abi in so_files:
              res = subprocess.run(["readelf", "-lW", full_path], capture_output=True, text=True)
              if res.returncode != 0:
                  print(f"ERROR: readelf failed for {rel_path}: {res.stderr}")
                  overall_failure = True
                  continue

              load_segments = []
              for line in res.stdout.splitlines():
                  tokens = line.strip().split()
                  if not tokens:
                      continue
                  if tokens[0] == "LOAD":
                      try:
                          offset = int(tokens[1], 16)
                          vaddr = int(tokens[2], 16)
                          align_str = tokens[-1]
                          align = int(align_str, 16)
                          load_segments.append((offset, vaddr, align, align_str))
                      except Exception as ex:
                          print(f"ERROR: Failed parsing LOAD segment line in {rel_path}: '{line}' ({ex})")
                          overall_failure = True

              if not load_segments:
                  print(f"ERROR: No PT_LOAD segments found in {rel_path}!")
                  overall_failure = True
                  continue

              lib_ok = True
              for idx, (offset, vaddr, align, align_str) in enumerate(load_segments):
                  if abi in ("arm64-v8a", "x86_64"):
                      is_aligned = (align >= PAGE_SIZE_16KB) and ((vaddr - offset) % PAGE_SIZE_16KB == 0)
                      if is_aligned:
                          status = f"PASS (16 KB - {align_str})"
                      else:
                          status = f"FAIL (<16 KB - {align_str})"
                          lib_ok = False
                          overall_failure = True
                  else:
                      # 32-bit legacy ABI: verify standard 4 KB alignment
                      is_aligned = (align >= PAGE_SIZE_4KB) and ((vaddr - offset) % PAGE_SIZE_4KB == 0)
                      if is_aligned:
                          status = f"PASS (32-bit 4 KB - {align_str})"
                      else:
                          status = f"FAIL (<4 KB - {align_str})"
                          lib_ok = False
                          overall_failure = True

                  print(f"{rel_path:<42} {abi:<12} {idx:<4} {hex(offset):<12} {hex(vaddr):<14} {align_str:<10} {status}")

              library_results.append((rel_path, abi, lib_ok, len(load_segments)))

          print("=" * 105)

          if overall_failure:
              print("\nFAILURE: One or more native libraries do not satisfy ELF page alignment requirements!")
              sys.exit(1)

          print("\nSUCCESS: All native libraries passed ELF LOAD segment alignment verification.")
          print(f"Total libraries checked: {len(library_results)} across ABIs: {sorted(list(abis_found))}")
          EOF

      - name: Verify APK 16 KB Zip Alignment (zipalign)
        run: |
          set -euo pipefail
          echo "=== RUNNING ANDROID SDK ZIPALIGN 16 KB VERIFICATION ==="
          APK="build/coin-hell-api36-test.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file $APK does not exist!"
            exit 1
          fi

          ZIPALIGN_BIN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          echo "Using zipalign binary: $ZIPALIGN_BIN"
          echo "Executing command: zipalign -c -P 16 -v 4 $APK"

          set +e
          OUTPUT=$("$ZIPALIGN_BIN" -c -P 16 -v 4 "$APK" 2>&1)
          ZIPALIGN_EXIT=$?
          set -e

          echo "$OUTPUT"
          echo "=========================================="
          echo "zipalign exit code: $ZIPALIGN_EXIT"
          echo "=========================================="

          if [ $ZIPALIGN_EXIT -ne 0 ]; then
            echo "ERROR: zipalign verification failed with exit code $ZIPALIGN_EXIT!"
            exit 1
          fi

          if ! echo "$OUTPUT" | grep -iq "Verification succes"; then
            echo "ERROR: Verification confirmation not found in zipalign output!"
            exit 1
          fi

          echo "SUCCESS: APK satisfies Android 16 KB zip alignment requirements!"

      - name: Verify Exclusion of Non-Production Test Tools
        run: |
          echo "=== CHECKING FOR EXCLUDED FILES ==="
          if unzip -l build/coin-hell-api36-test.apk | grep -E "scenes/tests|scripts/tools|screenshots"; then
              echo "ERROR: Test files found in package!"
              exit 1
          else
              echo "VERIFIED: Test tools, runners, and capture scripts successfully excluded from export package."
          fi

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coin-hell-api36-test-apk
          path: build/coin-hell-api36-test.apk
          if-no-files-found: error
